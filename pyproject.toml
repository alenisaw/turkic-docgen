[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# ------------------------------------------------------------------------------
# PROJECT METADATA
# ------------------------------------------------------------------------------
[project]
name = "turkicdocgen"
version = "0.1.0"
description = "Synthetic document dataset factory for Turkic OCR and document understanding."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Alen Issayev" }]
keywords = [
    "ocr",
    "document-understanding",
    "synthetic-data",
    "turkic-languages",
    "dataset-generation",
]

# ------------------------------------------------------------------------------
# DEPENDENCIES
# ------------------------------------------------------------------------------
dependencies = [
    # --- Core & Utils ---
    "Pillow>=10.0.0,<13",
    "numpy>=1.24.0,<3",
    "pydantic>=2.0.0,<3",
    "PyYAML>=6.0.0,<7",
    "typer>=0.12.0,<1",
    "rich>=13.0.0,<16",
    
    # --- Data & Documents ---
    "pyarrow>=15.0.0,<25",
    
    # --- Web Panel & Testing ---
    "fastapi>=0.115.0,<1",
    "uvicorn>=0.30.0,<1",
    "jinja2>=3.1.0,<4",
    "httpx>=0.27.0,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<10",
    "ruff>=0.4.0,<1",
    "maturin>=1.7,<2",
    "datasets>=2.20.0,<5",
]
hf = [
    "datasets>=2.20.0,<5",
    "huggingface_hub>=0.23.0,<2",
]

[project.scripts]
turkicdocgen = "turkicdocgen.cli:app"

# ------------------------------------------------------------------------------
# TOOL CONFIGURATIONS
# ------------------------------------------------------------------------------
# Note: ruff and pytest configs are packaged under src/turkicdocgen/configs/project/
# to keep the root directory and pyproject.toml clean.

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
turkicdocgen = [
    "configs/**/*.yaml",
    "configs/**/*.ini",
    "configs/**/*.toml",
    "data/**/*.jsonl",
    "data/**/*.yaml",
    "data/**/*.txt",
    "data/**/*.md",
    "data/**/*.json"
]
