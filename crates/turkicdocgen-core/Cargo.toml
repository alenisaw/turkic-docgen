[package]
name = "turkicdocgen-core"
version = "0.1.0"
edition = "2021"
description = "Fast local validation utilities for TurkicDocGen manifests."
license = "Apache-2.0"

[lints]
workspace = true

[dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ttf-parser = "0.25"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "turkicdocgen-core"
path = "src/main.rs"
