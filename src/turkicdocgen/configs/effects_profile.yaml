    weighted_optional_effects:
      paper_texture_light: 0.75
      dark_printer_streaks: 0.65
      roller_streaks: 0.70
      toner_dropout: 0.65
      scanner_noise: 0.45
      ink_spots: 0.45
      stains: 0.25
