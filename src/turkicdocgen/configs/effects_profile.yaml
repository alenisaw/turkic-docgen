parameters:
  rotation_degrees: [-0.8, 0.8]
  office_scan_rotation_degrees: [-0.8, 0.8]
  low_dpi_scan_rotation_degrees: [-1.2, 1.2]
  photocopy_rotation_degrees: [-1.8, 1.8]
  phone_photo_rotation_degrees: [-4.0, 4.0]
  phone_photo_mild_rotation_degrees: [-4.0, 4.0]
  phone_photo_moderate_rotation_degrees: [-8.0, 8.0]
  phone_photo_extreme_rotation_degrees: [-14.0, 14.0]
  stamp_rotation_degrees: [-12.0, 12.0]
  stamp_heavy_rotation_degrees: [-18.0, 18.0]
  perspective_corner_offset_ratio: [0.02, 0.06]
  phone_photo_mild_corner_offset_ratio: [0.01, 0.04]
  phone_photo_moderate_corner_offset_ratio: [0.04, 0.08]
  phone_photo_extreme_corner_offset_ratio: [0.08, 0.12]
  blur_radius: [0.18, 0.52]
  jpeg_quality: [48, 78]
  scan_stripes: [16, 40]
  printer_streaks: [1, 4]
  roller_streaks: [1, 5]
  toner_speckles: [120, 340]
  toner_dropout: [2, 7]
  copy_border_alpha: [16, 42]
  scanline_jitter_px: [1, 3]
  color_blotches: [1, 3]
  ink_spots: [24, 70]
  pen_marks: [1, 3]
  scanner_noise_points: [90, 190]
  stamp_alpha: [72, 148]
  stain_alpha: [16, 42]
  stain_count: [1, 4]
  low_dpi_width: [720, 980]
  optional_effect_count: [2, 5]

safety:
  max_paragraph_text_pixel_coverage: 0.10
  max_color_blot_text_coverage: 0.05
  max_text_coverage_by_stamps: 0.12
  max_total_visual_damage_coverage: 0.22
  max_pen_crossed_body_lines: 2
  protect_zone_types: [title, metadata]
  reject_if_zone_polygon_invalid_after_transform: true
  store_effect_chain_in_manifest: true
