    weighted_optional_effects:
      scan_stripes: 0.75
      scanline_jitter: 0.45
      light_rotation: 0.85
      uneven_illumination: 0.45
      jpeg_compression: 0.70
      paper_feed_bands: 0.35
      signature_marks: 0.45
    transform_budget: 0.16
  low_dpi_scan:
    weight: 0.12
    required_effects: [downsample_upsample, jpeg_compression]
    weighted_optional_effects:
      paper_texture_light: 0.80
      blur: 0.75
      light_rotation: 0.80
      toner_speckles: 0.55
      scanline_jitter: 0.35
